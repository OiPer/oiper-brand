name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Set the version
        working-directory: apps/logo
        run: >
          npm version --no-git-tag-version
          "$(node -p "require('./package.json').version")-$(date -u +%Y%m%d%H%M%S)"

      - run: pnpm --filter @oiper/brand build

      - run: npm publish --access public --tag latest
        working-directory: apps/logo
