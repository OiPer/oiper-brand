name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Set the version
        working-directory: apps/logo
        run: |
          npm version --no-git-tag-version --allow-same-version "$(npm view @oiper/brand versions --json | node -p "JSON.parse(require('fs').readFileSync(0)).filter((v) => !v.includes('-')).at(-1)")"
          npm version --no-git-tag-version patch

      - run: pnpm --filter @oiper/brand build

      - run: npm publish --access public --tag latest
        working-directory: apps/logo
