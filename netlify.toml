[build]
  command = "pnpm --filter web build"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "https://oiper-brand.netlify.app/*"
  to = "https://brand.oiper.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/logo-compact/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/logo-background/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/text/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/logo-text/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/favicon*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"

[[headers]]
  for = "/oiper-brand-kit.zip"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=31536000, stale-while-revalidate=604800"
