<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OiPer Logo</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;650&family=Newsreader:opsz,wght@6..72,600&display=swap"
    />
    <style>
      :root {
        --bg: #0f1012;
        --surface: #17191c;
        --border: #24262a;
        --text: #e8eaed;
        --text-dim: #8a9099;
        --font-text: 'Inter', system-ui, sans-serif;
        --font-display: 'Newsreader', Georgia, serif;
        --font-mono: 'Fira Code', ui-monospace, monospace;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 1rem/1.6 var(--font-text);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .page {
        max-width: 72rem;
        margin: 0 auto;
        padding: 4.5rem 1.5rem;
      }
      h1 {
        font: 600 2.5rem/1.1 var(--font-display);
        letter-spacing: -0.02em;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1.5rem;
      }
      .brand-kit {
        flex-shrink: 0;
        padding: 0.5rem 0.875rem;
        border-radius: 6px;
        background: var(--text);
        color: var(--bg);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      .brand-kit:hover {
        background: #ffffff;
      }
      .lede {
        margin-top: 1rem;
        color: var(--text-dim);
        font-size: 1.125rem;
      }
      section {
        margin-top: 4.5rem;
      }
      h2 {
        font: 600 1.625rem/1.2 var(--font-display);
        letter-spacing: -0.01em;
      }
      .grid {
        display: grid;
        margin-top: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .grid > div {
        display: contents;
      }
      .grid > div > * {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .grid > div > :first-child {
        justify-content: flex-start;
        padding-left: 1rem;
      }
      .grid > div > .name {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0.75rem;
      }
      .grid > div:last-child > * {
        border-bottom: 0;
      }
      .grid .head > * {
        padding-block: 0.75rem;
        background: var(--surface);
        color: var(--text-dim);
        font-size: 0.8125rem;
        font-weight: 650;
        white-space: nowrap;
      }
      .grid .head > :first-child {
        border-top-left-radius: 6px;
      }
      .grid .head > :last-child {
        border-top-right-radius: 6px;
      }
      .icons {
        grid-template-columns: max-content repeat(5, auto);
      }
      .animated {
        grid-template-columns: max-content repeat(6, auto);
      }
      .wordmarks {
        grid-template-columns: max-content repeat(3, auto);
      }
      code {
        font: 0.875rem var(--font-mono);
      }
      .downloads {
        position: relative;
        display: flex;
        gap: 0.375rem;
      }
      .downloads button,
      .downloads a {
        display: inline-flex;
        align-items: center;
        height: 1.75rem;
        padding: 0 0.625rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: 500 0.75rem var(--font-text);
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }
      .downloads :is(button, a):hover,
      .downloads button[aria-expanded='true'] {
        border-color: var(--text-dim);
      }
      .menu {
        position: absolute;
        top: calc(100% + 0.375rem);
        left: 0;
        z-index: 10;
        display: grid;
        gap: 0.625rem;
        width: max-content;
        padding: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        box-shadow: 0 12px 32px rgb(0 0 0 / 0.5);
      }
      .menu-row {
        display: grid;
        grid-template-columns: 2.75rem auto;
        align-items: start;
        gap: 0.5rem;
      }
      .menu-row > span {
        padding-top: 0.3rem;
        color: var(--text-dim);
        font-size: 0.75rem;
        font-weight: 650;
      }
      .menu-row > div {
        display: grid;
        grid-template-columns: repeat(4, auto);
        gap: 0.375rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
