<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OiPer Logo</title>
    <style>
      :root {
        --bg: #0f1012;
        --surface: #17191c;
        --border: #24262a;
        --text: #e8eaed;
        --text-dim: #8a9099;
        --font-text: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-display: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 1rem/1.6 var(--font-text);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .page {
        max-width: 72rem;
        margin: 0 auto;
        padding: 4.5rem 1.5rem;
      }
      h1 {
        font: 600 2.5rem/1.1 var(--font-display);
        letter-spacing: -0.02em;
      }
      .lede {
        margin-top: 1rem;
        color: var(--text-dim);
        font-size: 1.125rem;
      }
      section {
        margin-top: 4.5rem;
      }
      h2 {
        font: 600 1.625rem/1.2 var(--font-display);
        letter-spacing: -0.01em;
      }
      .grid {
        display: grid;
        margin-top: 1.5rem;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .grid > div {
        display: contents;
      }
      .grid > div > * {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .grid > div > :first-child {
        justify-content: flex-start;
        padding-left: 1rem;
      }
      .grid > div:last-child > * {
        border-bottom: 0;
      }
      .grid .head > * {
        padding-block: 0.75rem;
        background: var(--surface);
        color: var(--text-dim);
        font-size: 0.8125rem;
        font-weight: 650;
        white-space: nowrap;
      }
      .icons {
        grid-template-columns: max-content repeat(5, auto);
      }
      .animated {
        grid-template-columns: max-content repeat(6, auto);
      }
      .wordmarks {
        grid-template-columns: max-content repeat(3, auto);
      }
      code {
        font: 0.875rem var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
